[project]
name = "secret-token"
version = "1.1.0"
authors = [{ name = "Lexi Robinson", email = "lexi@lexi.org.uk" }]
description = "Easy manipulation of RFC8959 secret-token URIs"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.7"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Topic :: Security",
    "Topic :: Utilities",
    "Typing :: Typed",
]
keywords = ["rfc8959"]

[project.urls]
Homepage = "https://github.com/Lexicality/secret-token"
Issues = "https://github.com/Lexicality/secret-token/issues"
Repository = "https://github.com/Lexicality/secret-token.git"


[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"


[dependency-groups]
lint = ["black==20.8b1", "flake8~=3.8", "flake8-isort~=4.0", "isort~=5.7"]
test = ["tox~=3.21"]


[tool.tox]
legacy_tox_ini = """
[tox]
# Currently supported python versions
envlist = py37,py38,py39

[testenv]
# install pytest in the virtualenv where commands will be executed
deps = pytest
commands =
    # NOTE: you can run any command line tool here - not just tests
    pytest
"""


[tool.black]
target-version = ['py37']


[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
