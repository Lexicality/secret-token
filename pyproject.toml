[project]
name = "secret-token"
version = "1.1.0"
authors = [{ name = "Lexi Robinson", email = "lexi@lexi.org.uk" }]
description = "Easy manipulation of RFC8959 secret-token URIs"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Utilities",
    "Typing :: Typed",
]
keywords = ["rfc8959"]

[project.urls]
Homepage = "https://github.com/Lexicality/secret-token"
Issues = "https://github.com/Lexicality/secret-token/issues"
Repository = "https://github.com/Lexicality/secret-token.git"


[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"


[dependency-groups]
lint = ["ruff==0.15.16"]
test = ["pytest~=9.0", "tox-uv~=1.35", "tox~=4.55"]


[tool.tox]
env_list = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.tox.env_run_base]
description = "run the test suite with pytest"
deps = ["pytest~=9.0"]
commands = [
    [
        "pytest",
        { replace = "posargs", default = [
            "tests",
        ], extend = true },
    ],
]


[tool.ruff.lint]
extend-select = [
    "COM", # flake8-commas
    "FA",  # flake8-future-annotations
    "I",   # isort
    "ICN", # flake8-import-conventions
    "ISC", # flake8-implicit-str-concat
    "T10", # flake8-debugger
    "T20", # flake8-print
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
combine-as-imports = true
